<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Clone</title>
    <link rel="shortcut icon" href="//abs.twimg.com/favicons/twitter.3.ico" />
    <script type="module" src="/src/main.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-white">
    <div
      class="x-scrollbar flex flex-col pt-4 pl-10 pr-2 w-80 h-screen overflow-y-auto overflow-x-hidden sticky top-0 firstdiv"
    >
      <nav>
        <div
          class="x h-13 w-13 p-2 transition duration-300 cursor-pointer rounded-full hover:bg-gray-200"
        >
          <img src="logo.png" alt="X Logo" class="w-9 h-9" />
        </div>

        <ul class="flex flex-col text-xl mt-3 cursor-pointer">
          <li
            class="w-40 p-2 duration-300 rounded-full h-13 hover:bg-gray-200 font-bold"
          >
            <div
              class="dot rounded-full bg-[#1D9BF0] h-2 w-2 absolute left-17"
            ></div>
            <i class="text-3xl ri-home-fill"></i>
            &nbsp; &nbsp;Home
          </li>
          <li class="w-40 p-2 duration-300 rounded-full hover:bg-gray-200 h-13">
            <i class="text-3xl ri-search-line"></i>
            &nbsp; &nbsp;Explore
          </li>
          <li
            class="w-48 p-2 transition duration-300 rounded-full hover:bg-gray-200 h-13"
          >
            <i class="text-3xl ri-notification-4-line"></i
            >&nbsp;&nbsp;&nbsp;Notifications
          </li>
          <li
            class="w-35 p-2 transition duration-300 rounded-full hover:bg-gray-200 h-13"
          >
            <i class="text-3xl ri-user-follow-line"></i>
            &nbsp; &nbsp;Follow
          </li>
          <li
            class="w-35 p-2 transition duration-300 rounded-full hover:bg-gray-200 h-13"
          >
            <i class="text-3xl ri-chat-1-line"></i>
            &nbsp; &nbsp;Chat
          </li>
          <li
            class="w-35 p-2 transition duration-300 rounded-full hover:bg-gray-200 h-13"
          >
            <div
              class="dot rounded-full bg-[#1D9BF0] h-2 w-2 absolute left-19"
            ></div>
            <i class="text-3xl ri-grok-ai-line"></i>
            &nbsp; &nbsp;Grok
          </li>
          <li
            class="w-35 p-2 transition duration-300 rounded-full hover:bg-gray-200 h-13"
          >
            <i class="text-3xl ri-user-line"></i>
            &nbsp; &nbsp;Profile
          </li>
          <li
            class="w-35 p-2 transition duration-300 rounded-full hover:bg-gray-200 h-13"
          >
            <i class="text-3xl ri-more-line"></i>
            &nbsp; &nbsp;More
          </li>

          <button
            class="h-12 mt-2 mr-40 text-lg font-bold text-white transition duration-300 bg-black rounded-full cursor-pointer w-55 hover:bg-gray-800"
          >
            Post
          </button>
        </ul>
        <div
          class="flex items-center gap-1 p-4 mt-4 transition duration-300 rounded-full cursor-pointer user hover:bg-gray-200 w-60 h-14"
        >
          <img
            src="user.png"
            alt="X user"
            class="cursor-pointer w-15 h-15 rounded-3xl"
          />
          <div class="userinfo">
            <h3 class="font-bold">John Doe</h3>
            <p class="text-gray-500">@johndoe</p>
          </div>
          &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
          <i class="text-3lg ri-more-line"></i>
        </div>
      </nav>
    </div>

    <div class="second absolute top-0 left-80">
      <div class="faf flex items-center">
        <div
          class="foryou h-14 w-65 p-7 px-10 py-4 text-center hover:bg-gray-200 cursor-pointer transition duration-300 text-bold relative font-bold"
        >
          For you
          <div
            class="dot h-1 w-14 bg-[#1D9BF0] absolute left-25 bottom-0 rounded-full"
          ></div>
        </div>
        <div
          class="following h-14 w-65 p-7 px-10 py-4 text-center text-[#536471] hover:bg-gray-200 cursor-pointer transition duration-300"
        >
          Following
        </div>
        <div
          class="plus h-12 w-10 transition duration-300 hover:bg-gray-200 py-3 text-center"
        >
          <i class="ri-add-line"></i>
        </div>
      </div>

      <div class="line1 h-1 w-140 bg-[#FAFAFA] absolute left-0"></div>

      <div class="whatsnew flex mt-2">
        <img
          src="user.png"
          alt="X user"
          class="w-15 h-15 rounded-full object-cover cursor-pointer transition duration-300 hover:brightness-75"
        />

        <h2 class="text-[20px] font-sans text-[#536471] mt-3">
          What's Happening?
        </h2>
      </div>
      <div
        class="icons cursor-pointer flex gap-1 mt-3 text-[#9db3c6] absolute left-13 text-2xl"
      >
        <div
          class="h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i class="ri-image-2-line group-hover:text-[#697A86]"></i>
        </div>
        <div
          class="gif h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i
            class="ri-file-gif-line ease-out transition duration-300 group-hover:text-[#697A86]"
          ></i>
        </div>
        <div
          class="grock h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i
            class="ri-grok-ai-line ease-out transition duration-300 group-hover:text-[#697A86]"
          ></i>
        </div>
        <div
          class="poll h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i
            class="ri-chat-poll-line ease-out transition duration-300 group-hover:text-[#697A86]"
          ></i>
        </div>
        <div
          class="imoji h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i
            class="ri-emotion-happy-line ease-out transition duration-300 group-hover:text-[#697A86]"
          ></i>
        </div>
        <div
          class="schecudle h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i
            class="ri-calendar-schedule-line ease-out transition duration-300 group-hover:text-[#697A86]"
          ></i>
        </div>
        <div
          class="loc h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i
            class="ri-map-pin-line ease-out transition duration-300 group-hover:text-[#697A86]"
          ></i>
        </div>
        <div
          class="flag h-9 w-9 flex items-center justify-center cursor-pointer transition duration-300 rounded-full ease-out hover:bg-gray-200 hover:scale-111 group"
        >
          <i
            class="ri-flag-2-line ease-out transition duration-300 group-hover:text-[#697A86]"
          ></i>
        </div>

        <button
          class="h-10 mt-0 mr-40 text-base font-bold text-white bg-[#C2C5C4] rounded-full w-19 absolute left-105"
        >
          Post
        </button>
      </div>

      <div class="mt-15 h-1 w-140 bg-[#FAFAFA] absolute left-0"></div>

      <div
        class="mt-15 transition duration-300 cursor-pointer user hover:bg-gray-200 w-140 h-100"
      >
        <div class="userinfo p-3">
          <img
            src="cnn.jpg"
            alt="X user"
            class="object-cover transition duration-300 hover:brightness-90 cursor-pointer rounded-sm w-10 h-10"
          />
          <div class="up flex items-center gap-1 absolute top-50 left-15">
            <h3 class="font-bold hover:underline">CNN</h3>
            <i class="ri-verified-badge-fill text-[#E2B719]"></i>
            <p class="text-gray-500 hover:underline">@CNN</p>
            <p class="text-gray-500">. 7h</p>
          </div>

          <div class="leftsec flex items-center absolute top-50 left-120">
            <!-- 1. Grok Icon -->

            <!-- YEH PARENT DIV LAGAYA HAI -->

            <!-- 1. Grok Icon -->
            <div
              class="group h-8 w-8 flex items-center justify-center rounded-full cursor-pointer transition duration-300 hover:bg-blue-100"
            >
              <i
                class="ri-grok-ai-line text-xl text-gray-700 transition duration-300 group-hover:text-blue-500"
              ></i>
            </div>

            <!-- 2. More Icon -->
            <div
              class="group h-8 w-8 flex items-center justify-center rounded-full cursor-pointer transition duration-300 hover:bg-blue-100"
            >
              <i
                class="ri-more-line text-xl text-gray-700 transition duration-300 group-hover:text-blue-500"
              ></i>
            </div>
          </div>
          <p class="top-58 text-[15px] left-15 absolute">
            Lula says Flávio is a "jinx" and that the senator went to the US to
            seek "protection"
          </p>
          <img
            src="cnnpic.jpg"
            alt="X user"
            class="cursor-pointer rounded-2xl w-120 h-65 mt-10 top-63 left-15 absolute"
          />
        </div>
        <div class="endicons">
          <i class="ri-chat-1-line"></i>
          <i class="ri-arrow-up-down-line"></i>
          <i class="ri-heart-line"></i>
          <i class="ri-bar-chart-line"></i>
          <i class="ri-bookmark-line"></i>
          <i class="ri-upload-2-line"></i>
        </div>
      </div>
    </div>
  </body>
</html>
